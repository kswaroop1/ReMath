name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify focused red evidence
        run: |
          set -euo pipefail
          verify_red() {
            local sha="$1"
            local name="$2"
            local worktree
            local log
            worktree="$(mktemp -d)"
            log="$(mktemp)"
            git worktree add --detach "$worktree" "$sha"
            if (
              cd "$worktree"
              flutter pub get >/dev/null
              flutter test -r expanded \
                test/features/backup/data/progress_recovery_test.dart \
                --plain-name "$name"
            ) >"$log" 2>&1; then
              cat "$log"
              echo "Expected focused red test to fail: $name" >&2
              exit 1
            fi
            cat "$log"
            git worktree remove --force "$worktree"
          }
          verify_red d4a908a30ecdd0510c74d0a1b70fb49f56b6c65e \
            "recovery advances an earlier local Study snapshot"
          verify_red e9be6970af3c65d1f5f6cc9b465d104716abaf35 \
            "imported progress invalidates an advanced local Home session"
          verify_red 58e16fd539ffa44fe95060d51ccc25a2dcfcc0a1 \
            "Study recovery rejects a snapshot with missing earlier serials"
          verify_red bf2ef133111e0fc75968282349355a61af91211f \
            "Study serial evidence must belong to its session"
      - name: Verify committed application structure
        run: dart run tool/verify_project_structure.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Validate content packs
        run: dart run tool/validate_content.dart assets/content/foundation_arithmetic/pack.json
      - name: Verify browser contracts in Chrome
        run: >-
          flutter test --platform chrome
          test/features/algebra/domain/algebra_review_test.dart
          test/features/backup/data/open_backup_file_boundary_web_test.dart
      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        run: flutter test --coverage
      - name: Enforce coverage floor
        run: dart run tool/check_coverage.dart 90
