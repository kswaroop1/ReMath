name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify focused content lifecycle red evidence
        run: |
          set -euo pipefail
          verify_red() {
            local sha="$1"
            local file="$2"
            local expected="$3"
            local worktree
            local log
            worktree="$(mktemp -d)"
            log="$(mktemp)"
            git worktree add --detach "$worktree" "$sha"
            if (
              cd "$worktree"
              flutter pub get >/dev/null
              flutter test -r expanded "$file"
            ) >"$log" 2>&1; then
              cat "$log"
              echo "Expected focused content lifecycle test to fail." >&2
              exit 1
            fi
            cat "$log"
            grep -F "$expected" "$log"
            git worktree remove --force "$worktree"
          }
          verify_red d806655da5cbf69b2dd3dfec4a19d91c8809ab96 \
            test/features/learning/data/content_pack_release_validator_test.dart \
            "CP-004 release validation is not implemented"
          verify_red b5ef673128d48e7af4c2c820febd9ee5e206bc28 \
            test/features/learning/domain/content_pack_storage_forecast_test.dart \
            "CP-010 storage forecast is not implemented"
          verify_red 8b31697250b144402bc95480ecaec9d4ad1ec2ee \
            test/features/learning/domain/content_pack_catalogue_test.dart \
            "CP-011 catalogue states are not implemented"
          verify_red 9fa292874867eb04db053025df1a196d1dfc954d \
            test/features/learning/application/content_pack_installer_test.dart \
            "CP-006 transactional installation is not implemented"
      - name: Verify committed application structure
        run: dart run tool/verify_project_structure.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Validate content packs
        run: dart run tool/validate_content.dart assets/content/foundation_arithmetic/pack.json
      - name: Verify browser contracts in Chrome
        run: >-
          flutter test --platform chrome
          test/features/algebra/domain/algebra_review_test.dart
          test/features/backup/data/open_backup_file_boundary_web_test.dart
      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        run: flutter test --coverage
      - name: Enforce coverage floor
        run: dart run tool/check_coverage.dart 90
