name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify focused content lifecycle red evidence
        run: |
          set -euo pipefail
          verify_red() {
            local sha="$1"
            local file="$2"
            local expected="$3"
            local worktree
            local log
            worktree="$(mktemp -d)"
            log="$(mktemp)"
            git worktree add --detach "$worktree" "$sha"
            if (
              cd "$worktree"
              flutter pub get >/dev/null
              flutter test -r expanded "$file"
            ) >"$log" 2>&1; then
              cat "$log"
              echo "Expected focused content lifecycle test to fail." >&2
              exit 1
            fi
            cat "$log"
            grep -F "$expected" "$log"
            git worktree remove --force "$worktree"
          }
          git fetch origin refs/pull/24/head
          git cat-file -e 651cf1411a5a0b63956854c2329d4506ed1070a1^{commit}
          verify_red 5e22f53a8c7239085cb518cf000cc8efa85259ed \
            test/features/learning/domain/publisher_trust_store_test.dart \
            "SP-006 publisher onboarding is not implemented"
          verify_red 0d9d8f9016dd090b7ef4e958157dd0a103d780b6 \
            test/features/learning/domain/publisher_trust_store_test.dart \
            "Which: returned <null>"
