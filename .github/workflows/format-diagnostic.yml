name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print canonical formatter patch
        run: |
          dart format lib/src/features/learning/data/content_pack_release_parser.dart \
            test/features/learning/data/content_pack_release_parser_test.dart
          git diff --exit-code -- \
            lib/src/features/learning/data/content_pack_release_parser.dart \
            test/features/learning/data/content_pack_release_parser_test.dart
